# Harden-Runner secure-registry post step (SR-CI-12): job summary, notices,
# token revoke. ubuntu-latest is left out: int Harden-Runner builds kill
# those jobs (see control.yml). The post step's output is checked from the
# run logs afterwards; nothing here can see it.
name: SR-CI-12 post step

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # npm ci plus the cooldown probe, so the registry records held and
  # blocked versions. Expect in post: summary read, then "run token revoked".
  summary-revoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-slim]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12-secure-registry-post
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-npm.sh secure
      - run: bash .github/scripts/check-npm.sh cooldown blocked

  summary-revoke-container:
    runs-on: ubuntu-latest
    container: node:22
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12-secure-registry-post
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-npm.sh secure

  # Expect in post: notice that npm stopped using secure-registry.
  setup-node-override:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12-secure-registry-post
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm config get registry

  # Expect in post: lockfile warning for package-lock.json.
  lockfile-leak:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12-secure-registry-post
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund ms@2.1.3
      - run: |
          npm --version
          npm config get replace-registry-host
          git diff package-lock.json | head -60
      # A fresh lockfile, no npmjs entries to keep (SR-CI-02 case).
      - run: |
          mkdir -p fresh && cd fresh
          npm init -y >/dev/null
          npm install --no-audit --no-fund ms@2.1.3
          grep resolved package-lock.json

  # Expect in post: no secure-registry lines at all.
  not-configured:
    runs-on: macos-latest
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12-secure-registry-post
        with:
          egress-policy: audit
      - run: echo nothing to do

  # npm 10 (node:22 image), the version SR-CI-02 saw leak our host into
  # lockfiles. Expect in post: lockfile warning for package-lock.json.
  lockfile-leak-npm10:
    runs-on: ubuntu-latest
    container: node:22
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12-secure-registry-post
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund ms@2.1.3
      - run: |
          npm --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff package-lock.json | grep -E '^\+.*resolved' || true

  # npm 10 and 11 both record registry.npmjs.org URLs against int, so the
  # leak is simulated to exercise the post-step check on real runners.
  # Expect in post: lockfile warning for package-lock.json.
  lockfile-simulated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            container: node:22
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12-secure-registry-post
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: |
          host=$(npm config get registry | cut -d/ -f3)
          sed -i.bak "s#https://registry.npmjs.org/#https://$host/javascript/#" package-lock.json
          rm package-lock.json.bak
          grep -c "$host" package-lock.json
