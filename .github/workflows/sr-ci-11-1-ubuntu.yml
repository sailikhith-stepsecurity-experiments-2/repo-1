# SR-CI-11.1: is ubuntu-latest killed because of 11.1 (230f42e, after) or also on
# the int build before it (6264bfe, before)? Throwaway control, delete after.
name: SR-CI-11.1 ubuntu control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  before-no-id-token:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@6264bfea2bc3f0fe1efeaec44852aad8ed81c862
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: npm config get registry && npm ci --no-audit --no-fund && sleep 20 && echo alive

  before-id-token:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@6264bfea2bc3f0fe1efeaec44852aad8ed81c862
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: npm config get registry && npm ci --no-audit --no-fund && sleep 20 && echo alive

  after-no-id-token:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@230f42e010873653dd55adabd629c665a72ceaef
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: npm config get registry && npm ci --no-audit --no-fund && sleep 20 && echo alive

  after-id-token:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@230f42e010873653dd55adabd629c665a72ceaef
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - run: npm config get registry && npm ci --no-audit --no-fund && sleep 20 && echo alive
