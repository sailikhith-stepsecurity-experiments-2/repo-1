# Control for the SR-CI-11 test: do ubuntu-latest jobs fail with Harden-Runner
# alone, independent of secure-registry? No secure-registry input anywhere.
name: Control ubuntu-latest jobs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-harden-runner:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: sleep 20 && echo done

  upstream-main-prod:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: sleep 20 && echo done

  upstream-v2-release:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: sleep 20 && echo done

  fork-feature-prod:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@feature/sr-ci-11-secure-registry-pre
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: sleep 20 && echo done

  fork-int:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-11-secure-registry-pre
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: sleep 20 && echo done
