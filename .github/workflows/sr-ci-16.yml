name: ci

on:
  workflow_dispatch:
    inputs:
      config:
        description: "secure-registry input (true, or YAML)"
        type: string
        default: "true"
      runner:
        description: "runs-on label"
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  id-token: write

jobs:
  sr:
    uses: ./.github/workflows/sr-job.yml
    with:
      config: ${{ inputs.config }}
      runner: ${{ inputs.runner }}
