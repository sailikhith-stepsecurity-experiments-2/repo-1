name: SR-CI-14 e2e
on:
  workflow_dispatch:
    inputs:
      runner:
        type: string
        default: macos-latest
      settle_seconds:
        description: Seconds to wait after the last registry request, so async audit rows land before the post-step summary and insights read them
        type: string
        default: '20'
permissions:
  contents: read
jobs:
  community-oidc:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: sailikhith-stepsecurity-experiments-2/repo-1/.github/actions/dump-summary@main
      - uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12.1-binding-summary
        with:
          egress-policy: audit
          secure-registry: true
      - uses: actions/checkout@v4
      - name: npm ci through secure-registry
        run: bash .github/scripts/check-npm.sh secure
      - name: Cooldown probe (held and blocked)
        run: bash .github/scripts/check-npm.sh cooldown blocked
      - name: Wait for audit rows to land (test only)
        if: ${{ inputs.settle_seconds != '0' }}
        run: sleep "${{ inputs.settle_seconds }}"
