name: crid-probe
description: SR-CI-11.1 spike - does an input default of job.check_run_id resolve in pre and main? (do not use)
inputs:
  check-run-id:
    description: hidden
    required: false
    default: ${{ job.check_run_id }}
  token:
    description: hidden
    required: false
    default: ${{ github.token }}
runs:
  using: node24
  pre: pre.js
  main: main.js
